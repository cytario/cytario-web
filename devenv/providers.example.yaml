# Example OSS provider catalog (SRS-CY-60005).
#
# In an OSS self-hosted build (no admin portal) the connection-creation and share
# selectors are populated from this deploy-time file, referenced by
# PROVIDERS_OSS_CONFIG_PATH. The operator pre-provisions the OIDC identity
# provider and the IAM roles out of band; there is no runtime CreateRole and no
# Cytario Admin Role in this variant.
#
# The shape mirrors the admin-portal lookup JSON (§4.12) exactly, so the two
# build sources are interchangeable. It never contains a Cytario Admin Role ARN,
# an ExternalId, or any management credential.

providerConnections:
  - id: aws-eu-central-1
    name: AWS eu-central-1 # customer-supplied display name shown in the connection selector
    providerType: aws
    endpoint: null # null => AWS default (https://s3.<region>.amazonaws.com)
    region: eu-central-1
    status: connected # pending | connected | drifted | error

  # A RustFS provider connection. The operator pre-provisions the RustFS side
  # out of band (see the user guide's RustFS storage-onboarding runbook): the
  # OIDC trust against the Keycloak realm, the per-org IAM policies, and the
  # marker-named IAM groups they attach to. RustFS mints carry no role ARN —
  # the per-org mapped policies carry the entitlement and the inline session
  # policy scopes the connection.
  - id: rustfs-selfhosted
    name: RustFS (self-hosted)
    providerType: rustfs
    endpoint: https://s3.example.com
    region: eu-central-1 # used for SigV4 signing against the RustFS endpoint
    status: connected

  # A public (credential-less) provider connection: the bucket's own
  # public-read policy is the entire entitlement, so this provider declares NO
  # provider roles below and its connections are read-only. One public
  # provider per backend and region. The bucket must allow anonymous listing
  # (s3:ListBucket for Principal "*") and cross-origin GET/HEAD reads; a
  # non-AWS host must use https (the browser data plane is TLS-only —
  # connect-src is derived per request from the provider catalog).
  - id: public-open-data
    name: Open Data (public)
    providerType: aws
    endpoint: null
    region: us-east-1
    status: connected
    isPublic: true

providerRoles:
  # A role is identified by (provider connection, access level) — the portal
  # provisions exactly one per (bucket, level), and grants reference the level;
  # cytario-web resolves the role server-side. No id or display name: the level
  # is what the user picks.
  - providerConnectionId: aws-eu-central-1
    roleArn: arn:aws:iam::123456789012:role/cytario/provider-roles/reader
    allowedScopes:
      - lab/team-a
    accessLevel: read-only # read-only | annotate | read-write | admin

  - providerConnectionId: aws-eu-central-1
    roleArn: arn:aws:iam::123456789012:role/cytario/provider-roles/admin
    allowedScopes:
      - lab
    accessLevel: admin # the only level that permits s3:PutBucketPolicy

  # RustFS roles: one per access level under the RustFS connection; `roleArn`
  # is null (no ARN on RustFS — the per-org mapped policies carry the
  # entitlement; the AWS-only mint paths fail closed on it), `allowedScopes`
  # mirrors the buckets the operator attached the level's policy to.
  - providerConnectionId: rustfs-selfhosted
    roleArn: rustfs:read-only
    allowedScopes: [] # empty = org-wide
    accessLevel: read-only
    bucketIds: [] # no bucket registry in an OSS catalog

  - providerConnectionId: rustfs-selfhosted
    roleArn: rustfs:admin
    allowedScopes: []
    accessLevel: admin
    bucketIds: []
