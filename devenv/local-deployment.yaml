apiVersion: v1
kind: Pod
metadata:
  name: postgres-pod
spec:
  containers:
    - name: postgres
      image: docker.io/postgres:18
      env:
        - name: POSTGRES_DB
          value: "keycloak"
        - name: POSTGRES_USER
          value: "keycloak"
        - name: POSTGRES_PASSWORD
          value: "password"
      ports:
        - containerPort: 5432
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: postgres-data
      hostPath:
        path: ./postgres-data
        type: DirectoryOrCreate
  network: cytario

---
apiVersion: v1
kind: Pod
metadata:
  name: keycloak-pod
spec:
  initContainers:
    - name: wait-for-postgres
      image: docker.io/busybox:latest
      command:
        - "sh"
        - "-c"
        - >
          until nc -z postgres-pod 5432; do
            echo "Waiting for Postgres to be ready...";
            sleep 2;
          done;
          echo "Postgres is ready."
  containers:
    - name: keycloak
      image: quay.io/keycloak/keycloak:26.7.5
      env:
        - name: KC_DB
          value: "postgres"
        - name: KC_DB_URL_HOST
          value: "postgres-pod"
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_URL_DATABASE
          value: "keycloak"
        - name: KC_DB_USERNAME
          value: "keycloak"
        - name: KC_DB_PASSWORD
          value: "password"
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: "admin"
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          value: "admin"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_FEATURES
          value: "organizations"
      ports:
        - containerPort: 8080
          hostPort: 8080
      args:
        - "start-dev"
  network: cytario
---
apiVersion: v1
kind: Pod
metadata:
  name: rustfs-pod
spec:
  initContainers:
    - name: wait-for-keycloak
      image: quay.io/curl/curl:latest
      command:
        - "sh"
        - "-c"
        - >
          until curl -sf http://keycloak:8080/realms/master/.well-known/openid-configuration; do
            echo "Waiting for Keycloak to be ready...";
            sleep 5;
          done;
          echo "Keycloak is ready."
  containers:
    - name: rustfs
      image: docker.io/rustfs/rustfs:1.0.1
      env:
        - name: RUSTFS_ACCESS_KEY
          value: "rustfsadmin"
        - name: RUSTFS_SECRET_KEY
          value: "rustfsadmin"
        - name: RUSTFS_VOLUMES
          value: "/data"
        # Web-identity federation against the local Keycloak realm. The
        # cytario-web client is the one the app's ID token is issued for;
        # claim-name `groups` is what the app's RustFS authorization model
        # conditions bucket policies on (see the RustFS storage-onboarding
        # guide). The bucket/policy provisioning runs out of band via the
        # admin console on :9001 or the rustfs CLI.
        - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
          value: "http://keycloak:8080/realms/master/.well-known/openid-configuration"
        - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
          value: "cytario-web"
        - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
          value: "1234567"
        - name: RUSTFS_IDENTITY_OPENID_SCOPES
          value: "openid profile"
        - name: RUSTFS_IDENTITY_OPENID_CLAIM_NAME
          value: "groups"
      ports:
        - containerPort: 9000
        - containerPort: 9001
        - hostPort: 9000
        - hostPort: 9001
      volumeMounts:
        - name: rustfs-data
          mountPath: /data
  volumes:
    - name: rustfs-data
      hostPath:
        path: ./rustfs-data
        type: DirectoryOrCreate
  network: cytario

---
apiVersion: v1
kind: Pod
metadata:
  name: cytario-db-pod
spec:
  containers:
    - name: postgres
      image: docker.io/postgres:18
      env:
        - name: POSTGRES_DB
          value: "cytario"
        - name: POSTGRES_USER
          value: "cytario"
        - name: POSTGRES_PASSWORD
          value: "cytario"
      ports:
        - containerPort: 5432
          hostPort: 5433
      volumeMounts:
        - name: cytario-db-data
          mountPath: /var/lib/postgresql/data
  volumes:
    - name: cytario-db-data
      hostPath:
        path: ./cytario-db-data
        type: DirectoryOrCreate
  network: cytario

---
apiVersion: v1
kind: Pod
metadata:
  name: valkey-pod
spec:
  containers:
    - name: valkey
      image: docker.io/valkey/valkey:9
      ports:
        - containerPort: 6379
          hostPort: 6379
      volumeMounts:
        - name: valkey-data
          mountPath: /data
  volumes:
    - name: valkey-data
      hostPath:
        path: ./valkey-data
        type: DirectoryOrCreate
  network: cytario

---
apiVersion: v1
kind: Network
metadata:
  name: cytario
